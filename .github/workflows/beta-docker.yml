name: Custom Docker Build

on:
  push:
    branches:
      - custom

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: buzzromain/decypharr
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/decypharr

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calculate_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: calculate_version
        run: |
          # This fork's own tags stop at v1.1.6, so describing against them
          # reported v1.1.7 for a tree built on upstream 2.4. Fetch upstream's
          # release tags into the runner instead — they are never pushed, which
          # keeps release.yml (push: tags: v*) from firing on them.
          git remote add upstream https://github.com/sirrobot01/decypharr.git 2>/dev/null || true
          git fetch --quiet --tags upstream || true

          VERSION=$(git describe --tags --always)
          echo "Resolved version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (Docker Hub)
        id: build_dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            CHANNEL=custom
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push by digest (GHCR)
        id: build_ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            CHANNEL=custom
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ghcr

          dockerhub_digest="${{ steps.build_dockerhub.outputs.digest }}"
          echo "Docker Hub digest: ${dockerhub_digest}"
          touch "/tmp/digests/dockerhub/${dockerhub_digest#sha256:}"

          ghcr_digest="${{ steps.build_ghcr.outputs.digest }}"
          echo "GHCR digest: ${ghcr_digest}"
          touch "/tmp/digests/ghcr/${ghcr_digest#sha256:}"

      - name: Upload Docker Hub digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-dockerhub-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/dockerhub/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload GHCR digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-ghcr-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/ghcr/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Hub digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/dockerhub
          pattern: digests-dockerhub-*
          merge-multiple: true

      - name: Download GHCR digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/ghcr
          pattern: digests-ghcr-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Docker Hub manifest and push
        working-directory: /tmp/digests/dockerhub
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker buildx imagetools create \
            --tag ${{ env.DOCKERHUB_IMAGE }}:custom \
            --tag ${{ env.DOCKERHUB_IMAGE }}:custom-$SHORT_SHA \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Create GHCR manifest and push
        working-directory: /tmp/digests/ghcr
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker buildx imagetools create \
            --tag ${{ env.GHCR_IMAGE }}:custom \
            --tag ${{ env.GHCR_IMAGE }}:custom-$SHORT_SHA \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
